[workspace]
resolver = "2"
members = ["feed-core", "methods", "server", "verifier-cli"]
exclude = ["methods/guest"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
feed-core = { path = "feed-core" }
inzktagram-methods = { path = "methods" }
risc0-zkvm = { version = "3.0.6" }
risc0-build = { version = "3.0.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
anyhow = "1.0"
hex = "0.4"
bincode = "1.3"

[profile.release]
lto = "thin"
